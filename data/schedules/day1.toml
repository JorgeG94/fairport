# A day at SIMPLE: one runway, six stands, two banks.
#
# Movements can be written either way, and both forms are here on purpose.
#
#   [[arrival]]  pins one movement exactly. Use it when a scenario or a test
#                needs to name an aircraft and have it mean the same thing
#                every run. Pinned movements load first, so their handles are
#                1, 2, 3... whatever the banks do afterwards.
#
#   [[bank]]     states volume and shape. The loader draws individual times
#                from the schedule's own random stream, sorts them, then draws
#                a wake category per slot. Reproducible from the seed, but not
#                readable off the page -- which is the trade.
#
# Times are HH:MM or HH:MM:SS on the scenario clock. `wake_mix` is relative
# weights for light, medium, heavy and super.

name = "Day 1, single runway"

# ---------------------------------------------------------------- pinned ----
# The four aircraft from clear_day, so a command naming aircraft 1 still means
# QFA412 after the banks below are resized.

[[arrival]]
callsign = "QFA412"
wake = "H"
pax = 240
at = "06:45"
runway = 1

[[arrival]]
callsign = "VOZ881"
wake = "M"
pax = 170
at = "06:52"
runway = 1

[[arrival]]
callsign = "UAE414"
wake = "S"
pax = 380
at = "06:58"
runway = 1

[[arrival]]
callsign = "JST615"
wake = "M"
pax = 186
at = "07:04"
runway = 1

# ----------------------------------------------------------------- banks ----
# Forty arrivals, which is eighty movements once each one leaves again -- the
# figure the design document gives for milestone 1.
#
# The windows are tight on purpose. Forty arrivals spread evenly across a day
# is a trickle that six stands absorb without complaint, and nothing
# interesting ever happens. Concentrated into two banks it is a wave, the
# stands fill, the stack builds, and a handful of aircraft run out of holding
# fuel. On this seed four of them do, which is about what the design's success
# criterion describes: a run where nothing was obviously done wrong still ends
# in diversions.
#
# The morning wave is the heavy one, with the long-haul in it and the only
# Super stand contended. The evening wave is lighter and mostly domestic.

[[bank]]
kind = "arrival"
prefix = "MOR"
from = "07:10"
to = "08:30"
count = 20
runway = 1
wake_mix = [1, 7, 3, 1]

[[bank]]
kind = "arrival"
prefix = "EVE"
from = "17:00"
to = "18:45"
count = 16
runway = 1
wake_mix = [2, 9, 2, 0]
